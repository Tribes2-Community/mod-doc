<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- assign page_title = page.title | default: site.title -%}
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
  <meta name="theme-color" content="#04090a">

  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/og.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Tribes 2 Mod Development Handbook: the twin-fork emblem beside the title.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/img/og.png' | absolute_url }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/emblem.svg' | relative_url }}">
</head>
