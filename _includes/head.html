<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- assign page_title = page.title | default: site.title -%}
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
  <meta name="theme-color" content="#04090a">

  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Favicon: HUD-green reticle, drawn inline so there is no binary asset. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2304090a'/><circle cx='16' cy='16' r='9' fill='none' stroke='%2300ff00' stroke-width='2'/><path d='M16 1v8M16 23v8M1 16h8M23 16h8' stroke='%2306f5d7' stroke-width='2'/></svg>">
</head>
